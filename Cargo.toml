[workspace]
resolver = "2"
members = ["crates/proto", "crates/view", "crates/connector", "crates/runtime", "crates/shell"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
proto = { path = "crates/proto" }
view = { path = "crates/view" }
connector = { path = "crates/connector" }
runtime = { path = "crates/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
log = "0.4"
env_logger = "0.11"
mlua = { version = "0.12", features = ["luau", "vendored"] }
rquickjs = { version = "0.14", features = ["classes"] }
