[package]
name = "tessela-cli"
description = "Runs tessela projects (tessela.toml): surfaces, plugins, theme; and inspects them (devtools)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "tessela"
path = "src/main.rs"

[features]
default = ["gpui"]
gpui = ["tessela/gpui", "dep:gpui", "dep:gpui_platform", "dep:futures"]

[dependencies]
tessela = { workspace = true, features = ["luau", "quickjs", "unix", "timer", "state", "desktop"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
libc = "0.2"
# The graphical devtools (`tessela devtools ui`).
gpui = { workspace = true, optional = true }
gpui_platform = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
